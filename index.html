<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务数据看板 · 统一入口</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef2f7 0%, #e3e9f2 100%);
    color: #2c3e50;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .page-header { text-align: center; margin-bottom: 36px; }
  .page-header h1 {
    font-size: 28px; font-weight: 700; color: #34495e; letter-spacing: 1px;
  }
  .page-header p { margin-top: 8px; color: #7f8c9a; font-size: 15px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;
  }
  .card {
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(52, 73, 94, 0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(52, 73, 94, 0.14); }
  .card-accent { height: 6px; width: 100%; }
  .card-body { padding: 22px 24px 26px; flex: 1; display: flex; flex-direction: column; }
  .card-title { font-size: 19px; font-weight: 700; color: #2c3e50; }
  .card-desc { margin-top: 6px; font-size: 13px; color: #95a3b3; min-height: 34px; }
  .links {
    margin-top: 18px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .link-btn {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 60px; padding: 12px 14px;
    border-radius: 10px; background: #f4f7fb;
    border: 1px solid #e8eef6; border-left: 4px solid var(--accent, #667eea);
    color: #34495e; text-decoration: none;
    font-size: 15px; font-weight: 600; line-height: 1.3;
    transition: all 0.18s;
  }
  .link-btn:hover {
    background: var(--accent-soft, #eef1fb);
    border-color: var(--accent, #667eea);
    color: var(--accent, #667eea);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(52, 73, 94, 0.10);
  }
  .link-btn .arrow { color: #b0bccb; font-size: 14px; flex-shrink: 0; margin-left: 8px; }
  .link-btn:hover .arrow { color: var(--accent, #667eea); }
  .footer { text-align: center; margin-top: 40px; color: #aab4c0; font-size: 12px; }
  @media (max-width: 520px) {
    .links { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <h1>业务数据看板 · 统一入口</h1>
      <p>点击卡片中的链接，跳转到各项目的看板与对比分析页面</p>
    </div>
    <div class="grid">
      <!-- 北京移动 -->
      <div class="card" style="--accent:#667eea; --accent-soft:#eef1fb;">
        <div class="card-accent" style="background:#667eea;"></div>
        <div class="card-body">
          <div class="card-title">北京移动业务数据看板</div>
          <div class="card-desc">流量套餐 + 宽带业务数据</div>
          <div class="links">
            <a class="link-btn" href="https://faye0366.github.io/beijing-dashboard/" target="_blank" rel="noopener">流量套餐看板 <span class="arrow">↗</span></a>
            <a class="link-btn" href="https://faye0366.github.io/beijing-dashboard/compare.html" target="_blank" rel="noopener">流量套餐对比分析 <span class="arrow">↗</span></a>
            <a class="link-btn" href="https://faye0366.github.io/beijing-dashboard/broadband.html" target="_blank" rel="noopener">宽带业务看板 <span class="arrow">↗</span></a>
            <a class="link-btn" href="https://faye0366.github.io/beijing-dashboard/broadband_compare.html" target="_blank" rel="noopener">宽带对比分析 <span class="arrow">↗</span></a>
          </div>
        </div>
      </div>
      <!-- 陕西移动 -->
      <div class="card" style="--accent:#1f9e8f; --accent-soft:#e6f4f1;">
        <div class="card-accent" style="background:#1f9e8f;"></div>
        <div class="card-body">
          <div class="card-title">陕西移动业务数据看板</div>
          <div class="card-desc">流量套餐业务数据</div>
          <div class="links">
            <a class="link-btn" href="https://faye0366.github.io/shaanxi-dashboard/" target="_blank" rel="noopener">流量套餐看板 <span class="arrow">↗</span></a>
            <a class="link-btn" href="https://faye0366.github.io/shaanxi-dashboard/compare.html" target="_blank" rel="noopener">流量套餐对比分析 <span class="arrow">↗</span></a>
          </div>
        </div>
      </div>
      <!-- 退费渠道 -->
      <div class="card" style="--accent:#e08a3c; --accent-soft:#fbeee0;">
        <div class="card-accent" style="background:#e08a3c;"></div>
        <div class="card-body">
          <div class="card-title">退费渠道数据看板</div>
          <div class="card-desc">退费渠道业务数据</div>
          <div class="links">
            <a class="link-btn" href="https://faye0366.github.io/refund-dashboard/" target="_blank" rel="noopener">渠道看板 <span class="arrow">↗</span></a>
            <a class="link-btn" href="https://faye0366.github.io/refund-dashboard/compare.html" target="_blank" rel="noopener">渠道对比分析 <span class="arrow">↗</span></a>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">数据看板统一入口 · 由 GitHub Pages 托管</div>
  </div>
</body>
</html>
